name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${{ github.sha }}" -o bunny-dsp .
      - name: cross-build (stub transport)
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/bunny-dsp.exe .
